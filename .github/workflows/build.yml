name: Build

# 公開せずに直近 1 か月（発言が無ければ発言のある月まで）の取得と dbt build だけを回す。API の形が変わったときに Sync より先に気づくため
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # 共通のスクリプト (dataset-shared) を main で取得する
      - run: git clone --depth=1 https://github.com/queria-io/dataset-shared.git shared
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run python -m unittest pipelines.test_kokkai
      - run: uv run python -c "import main; main.download()"
      - run: uv run dbt build --profiles-dir ci
      # 説明（tabledoc.yml とテーブルごとの *.tabledoc.yml）を、Sync と同じ tabledoc で検査する
      - run: uvx --isolated --refresh-package tabledoc --from "tabledoc>=0.8.0" tabledoc validate --strict
