name: Apply

on:
  push:
    branches: [main]
  schedule:
    # 会議録は開会から数週間〜数か月たって登録される。毎週月曜 04:00 JST に取得する
    - cron: "0 19 * * 0"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う。
    # contents と pull-requests は、Queria で変更された説明をこのリポジトリに戻す PR に使う
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@f89cad790a98fd7ee528dcdb13cb1b2fb6a8b964
    with:
      dataset_name: kokkai
      # 過去分は 1 回に最大 1,100 日分を取得し、100 分（KOKKAI_MAX_MINUTES）を超えたら取得済みの月までで止める
      timeout_minutes: 150
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
