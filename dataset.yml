# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
# Queria だけの項目（テーマ・カバー・列の意味）は annotations.queria に書く。
name: ndl
title: 国立国会図書館
description: |-
  国立国会図書館が公開するデータです。今は国会会議録検索システムの国会会議録を収録しています。

  国会会議録（kokkai）は、衆議院・参議院の本会議と委員会の会議録を、会議（kokkai.meetings）と発言（kokkai.speeches）のテーブルにしたものです。発言ごとに開会日・会議名・発言者・会派・肩書きと本文を持ち、会議録 ID で 2 つのテーブルを結合できます。毎週、検索用 API から新しく登録された会議録を取得します。

  出典：国会会議録検索システム（国立国会図書館）（https://kokkai.ndl.go.jp/）の検索用 API を利用して取得・加工したものです。データベースは国立国会図書館ウェブサイトのコンテンツ利用規約（公共データ利用規約 第 1.0 版に準拠）に従います。発言の著作権は各発言者にあり、公開して行われた政治上の演説又は陳述は著作権法 40 条 1 項により利用できます。
keywords:
  - 国会
  - 国会会議録
  - 会議録
  - 議事録
  - 発言
  - 衆議院
  - 参議院
  - 委員会
  - 本会議
  - 国会議員
  - 国立国会図書館
homepage: https://github.com/queria-io/dataset-ndl
language: ja
# データベース自体は国立国会図書館ウェブサイトのコンテンツ利用規約（PDL1.0 準拠）。
# 発言の著作権は各発言者にあり、政治上の演説又は陳述（著作権法 40 条 1 項）などの権利制限規定で利用する
licenses:
  - JP-PDL-1.0
sources:
  - title: 国会会議録検索システム 検索用 API
    path: https://kokkai.ndl.go.jp/api.html
contributors:
  - title: 国立国会図書館
    path: https://www.ndl.go.jp/
    roles: [publisher]
spatial_coverage: [JP]
update_frequency: weekly
schemas:
  - name: kokkai
    title: 国会会議録
annotations:
  queria:
    themes: [government_finance]
    cover: 🏛️
