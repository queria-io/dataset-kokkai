name: "kokkai"
version: "1.0.0"

profile: "kokkai"

model-paths: ["models"]
macro-paths: ["shared/macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  kokkai:
    +database: kokkai
    +materialized: table
    # raw は取得したまま、stg は列名の変更と重複の除外。どちらも mart の SQL に展開し、テーブルは作らない
    minutes:
      raw:
        +materialized: ephemeral
      stg:
        +materialized: ephemeral
